[project]
name = "iw3-for-comfyui"
description = "iw3 2D-to-3D nodes for ComfyUI: turn images and AI-generated videos into stereo SBS, TB, VR90 (VR180) or anaglyph 3D."
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "av>=19.0.2",
  "timm>=1.0.30",
  "safetensors",
  "einops",
  "omegaconf",
  "addict",
  "pillow_heif",
  "simpleeval",
  "scipy",
  "pyyaml",
  "packaging",
  "requests",
  "tqdm",
]

[project.urls]
Repository = "https://github.com/subheader6159/iw3_for_comfyui"

[tool.comfy]
PublisherId = ""
DisplayName = "iw3 2D to 3D / VR"
Icon = ""
# The nunif git submodule is not listed by `git ls-files`; ship only the packages iw3 needs.
includes = ["nunif/nunif", "nunif/iw3", "nunif/LICENSE", "nunif/NOTICE"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["nunif"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["iw3_comfyui"]
known-third-party = ["iw3", "nunif", "comfy", "comfy_api", "folder_paths"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["server: starts a real ComfyUI server"]
